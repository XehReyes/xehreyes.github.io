    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Media Emergenti','Pueblo Santo · A Cumbia Trip','2022','Creator & Director','A multi-reality interactive musical experience for VR. Pueblo Santo, the place where Cumbia music originated, suffered a horrible massacre that submerged the town in an eternal fog. Only the lost gaita player can bring the town back to life by playing Cumbia\'s original melody. The indigenous Amacumbié cosmogony intertwines with Colombia\'s history of violence, challenging the interactor to explore the town and restore life by learning to play Cumbia. Based on Historias Cantadas, a concept album by Gaiteros de Pueblo Santo (nominated for best folklore album at the 2021 Latin Grammys). Available for stand-alone VR headsets and as a physical multi-sensorial installation. Work-in-progress. Illustration by Laura Ortiz.\n\nDirector: María Cecilia Reyes · Producer: Laura Casadiego · Storyworld & Music: Marlon Peroza','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1648667205869-YORUCV1N3S36BL5CCCT1/Screenshot+2022-03-30+at+21.46.12.png',[])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Cinema','Same Different','2022','Co-Director','A poetry short film, a rare encounter between Khoekhoegowab and a still camera. The poem, written and performed by Ques (Nesindano Namises), together with the sounds of the bow and the forest, move along the sun, the wind, and the spirit of the poet herself. All Khoekhoegowab is also spoken in English. Subtitling is intentionally absent so as not to interrupt the rhythm of the poem and to create a sense of relation with Khoekhoegowab. Poster art by Namibian artist Vitjitua Ndjiharine.\n\nCo-directed by Ques (Nesindano Namises) & María Cecilia Reyes. Selected: 10th International Video Poetry Festival · International Poetry Film Festival of Thuringia (Germany) · Future Media Theaters, University of Skövde.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1651337730179-YVI1YT3K84MAJ88S8RBQ/IMG_3811.jpg',[])">

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','En el Principio Todo Era Cumbia','2021','Co-Creator & Performer','A storytelling and musical performance that explores the cosmogonies of Cumbia music, the meanings and stories in this ancient rhythm, its instruments, its songs, and its dance. A trip to the pre-Columbian Caribbean coast of the land today called Colombia. Through narration, dance, and live-streamed music connecting Barranquilla\'s downtown to Schloss Solitude, Marlon Peroza, Carlos Monroy and María Cecilia Reyes explore Cumbia as the original heartbeat: being Native American, African, colonized, enslaved; being feminine, masculine and everything in the spectrum; being water, earth, air, and fire.\n\nWith Marlon Peroza & Carlos Monroy. Developed at Schloss Solitude Akademie, Germany.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1633098814083-HR7R0PDQI4K5RRBMI3IS/Screenshot%2B2021-10-01%2Bat%2B16.25.14.jpg',[])">

    <div class="project-card reveal" data-category="Publication"

      onclick="openModal('Media Emergenti','Yona Friedman · Ceramic City VR','2021','VR Developer','Yona Friedman\'s Ceramic City brought to life in virtual reality. In 2002, during the second Biennale of Ceramics, architect Yona Friedman (Budapest, 1923) created his ideal city from ceramics, to inspire young generations of artists, architects, musicians, and designers. This VR experience (created through an interpretation by Omar Tonella) allows the user to activate choices that change scenery. The journey begins at the Savona Ceramics Museum and enters its virtual reproduction; the user activates Friedman\'s voice, which mixes with a 360° sound setting by ceramist Jorge Fernandez playing musical instruments made of ceramic.\n\nA project by the Ceramics Museum of Savona and the Department of Architecture and Design, University of Genoa. Conceived by Tiziana Casapietra.','img','images/yonafriedman.jpg',[{label:'Savona Ceramics Museum',url:'http://musa.savona.it/museodellaceramica/en/inside-yona-friedmans-ceramic-city/'}])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Cinema','NIJOLE','2020','Screenwriter & Editor','An intimate portrait of Lithuanian-Colombian artist Nijolė Sivickas (1925–2018) and her unusual relationship with her son, philosopher, mathematician and politician Antanas Mockus. Through Baltic landscapes and the streets of Bogotá, Nijolė and Antanas explore art, politics, migration, independence, the emancipation of women, and the concept of family. A film about the relationship between art and love, and about freedom.\n\nDirector: Sandro Bozzolo · Screenwriter & Editor: María Cecilia Reyes · Producers: Sandro Bozzolo, Max Chicco\n\nWorld Premiere: DOK.Leipzig 61st edition · Next Masters Competition · FICCI (Colombia) · Muestra Migración y Mestizaje · DOCSBarcelona · Selección Oficial Panorama · BiografilmFEST · Celebration of Lives Award · VDFF Vilnius · Opening Film','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1609175748826-XF5VF1F4K2VAFT6ZZBL9/Untitled2_1.250.1.jpg',[{label:'Watch on RTVCplay',url:'https://rtvcplay.co/peliculas-documentales/nijole'},{label:'Watch on Vimeo',url:'https://vimeo.com/ondemand/nijole'}])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Media Emergenti','ZENA · Interactive VR Film','2018','Director & Camera','"The one choosing the path won\'t be Lorenzo, but you." Lorenzo, a young apprentice of Alchemy, receives a call from the future through a dream: the magic clepsydra of his congregation is about to be destroyed. To save it he must travel 500 years into the future, to modern Zena (Genoa in the Genoese dialect). Through the journey he discovers how his city changed over centuries, finding new alleys and old enemies. To save the clepsydra he must pay close attention to details, because in Zena, things are not always what they seem.\n\nDirector & Camera: María Cecilia Reyes. First interactive VR film set in Genoa. Developed at the University of Genoa e-learning division.','img','images/zena.jpg',[])">

  function switchPub(id,btn) { document.querySelectorAll('.pub-tab').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active'); document.querySelectorAll('.pub-section').forEach(function(s){s.classList.remove('active');}); document.getElementById('pub-'+id).classList.add('active'); }

  /* PROJECT MODAL */
  function openModal(tag,title,year,role,desc,mediaType,mediaSrc,links) {
    document.getElementById('modal-tag').textContent=tag;
    document.getElementById('modal-title').textContent=title;
    document.getElementById('modal-year').textContent=year;
    document.getElementById('modal-role').innerHTML=role;
    var au = '', lc = window._lastCard, ae = lc && lc.querySelector('.project-authors');
    if (ae) au = txt(ae);
    var cell = document.getElementById('modal-authors-cell');
    if (!cell) { var row = document.querySelector('#modal-overlay .modal-meta-row'); cell = document.createElement('div'); cell.className = 'modal-meta-cell modal-authors-cell'; cell.id = 'modal-authors-cell'; cell.innerHTML = '<span class="modal-meta-label"></span><span class="modal-meta-value"></span>'; if (row) row.appendChild(cell); }
    cell.querySelector('.modal-meta-label').textContent = ({en:'Authors', es:'Autores', it:'Autori'})[LANG] || 'Authors';
    cell.querySelector('.modal-meta-value').textContent = au;
    cell.style.display = au ? '' : 'none';
    document.getElementById('modal-desc').textContent = au ? String(desc).replace(/\s*Auth?ors?\s*:[^\n]*\s*$/i, '') : desc;
    var mediaEl=document.getElementById('modal-media');
    if(mediaType==='img'&&mediaSrc) mediaEl.innerHTML='<img src="'+mediaSrc+'" alt="'+title+'" />';
    else if(mediaType==='video'&&mediaSrc) mediaEl.innerHTML='<iframe src="'+mediaSrc+'" allowfullscreen allow="autoplay"></iframe>';
    else mediaEl.innerHTML='<div class="modal-media-placeholder"><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="4" y="10" width="56" height="44" rx="1" stroke="#0a0a0a" stroke-width="1.5"/><path d="M4 44l14-14 10 10 12-16 20 20" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/></svg></div>';
    var linksEl=document.getElementById('modal-links'); linksEl.innerHTML='';
    if(links&&links.length) links.forEach(function(l){ if(l.url&&l.url!=='#'){ var a=document.createElement('a'); a.href=l.url; a.target='_blank'; a.rel='noopener'; a.className='modal-ext-link'; a.textContent=l.label; linksEl.appendChild(a); } });
    document.getElementById('modal-overlay').classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeModal() { var o=document.getElementById('modal-overlay'); if(o) o.classList.remove('open'); document.body.style.overflow=''; }
  function closeModalOnOverlay(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }
  document.addEventListener('click', function(e){ var c = e.target && e.target.closest && e.target.closest('.project-card'); if (c) window._lastCard = c; }, true);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeModal(); closeCourseModal(); closeNav(); } });

  /* CURRENT PROJECTS (data/current-projects.json) */
  var CURRENT_PROJECTS = [];
  function renderCurrentProjects(status){
    var container = document.getElementById('current-projects-list');
    if(!container) return;
    container.innerHTML = '';
    var items = CURRENT_PROJECTS.filter(function(p){ return p.status === status; });
    if(!items.length){
      var empty = document.createElement('p'); empty.className = 'cp-empty'; empty.textContent = CP_EMPTY[status] || '';
      container.appendChild(empty); return;
    }
    items.forEach(function(p){
      var row = document.createElement(p.link ? 'a' : 'div');
      row.className = 'cp-item';
      if(p.link){ row.href = p.link; row.target = '_blank'; row.rel = 'noopener'; }
      var range = (p.startDate || '') + (p.endDate ? ' – ' + p.endDate : (status === 'ongoing' ? ' – ' + CP_PRESENT : ''));
      var title = document.createElement('p'); title.className = 'cp-title'; title.textContent = p.title || '';
      var desc = document.createElement('p'); desc.className = 'cp-desc'; desc.textContent = p.description || '';
      var meta = document.createElement('p'); meta.className = 'cp-meta'; meta.textContent = range;
      row.appendChild(title); row.appendChild(desc); row.appendChild(meta);
      if(p.link){ var arrow = document.createElement('span'); arrow.className = 'cp-arrow'; arrow.textContent = '↗'; row.appendChild(arrow); }
      container.appendChild(row);
    });
  }
  function setProjectsFilter(status, btn){
    document.querySelectorAll('.cp-toggle-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    renderCurrentProjects(status);
  }

  /* REVEAL */
  var observer = null;
  function initReveal(){
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(function(entries){ entries.forEach(function(entry){ if(entry.isIntersecting){ entry.target.classList.add('visible'); observer.unobserve(entry.target); } }); },{threshold:0.02,rootMargin:'0px 0px -20px 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){ observer.observe(el); });
  }

  /* VIEWS + BENTO OVERVIEW */
  var UI = {
    en: { overview: 'Overview', projects: 'projects', pubs: 'publications', courses: 'courses', roles: 'roles & memberships', press: 'press & talks', lab: 'coordinates' },
    es: { overview: 'Inicio', projects: 'proyectos', pubs: 'publicaciones', courses: 'cursos', roles: 'roles y membresías', press: 'prensa y charlas', lab: 'coordina' },
    it: { overview: 'Panoramica', projects: 'progetti', pubs: 'pubblicazioni', courses: 'corsi', roles: 'ruoli e affiliazioni', press: 'stampa e talk', lab: 'coordina' }
  };
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function txt(el){ return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function q(sel){ return document.querySelector(sel); }
  function qa(sel){ return [].slice.call(document.querySelectorAll(sel)); }

  function buildShell(){
    var u = UI[LANG], app = document.getElementById('app');
    /* tabs */
    var tabs = document.getElementById('tabs'); tabs.innerHTML = '';
    function tab(href, label){ var a = document.createElement('a'); a.href = href; a.className = 'tab'; a.dataset.view = href.slice(1); a.textContent = label; tabs.appendChild(a); }
    tab('#overview', u.overview);
    qa('.nav-dropdown li a').forEach(function(a){ var n = a.querySelector('.nav-item-num'); tab(a.getAttribute('href'), txt(a).replace(txt(n), '').trim()); });
    function title(id){ return esc(txt(q('#' + id + ' .section-title'))); }
    function head(id){ return '<p class="tile-k"><span>' + title(id) + '</span><span class="go">→</span></p>'; }

    var h = '';
    /* intro */
    var chips = qa('.hero-descriptor span').map(function(s){ return '<span>' + esc(txt(s)) + '</span>'; }).join('');
    h += '<div class="tile t-intro" style="--i:0"><p class="tile-k"><span>' + esc(txt(q('.hero-label'))) + '</span></p>'
       + '<h1 class="b-name">' + q('.hero-name').innerHTML + '</h1><p class="b-tag">' + esc(txt(q('.hero-tagline'))) + '</p><div class="b-chips">' + chips + '</div></div>';
    /* photo + bio */
    var img = q('.headshot-wrapper img');
    h += '<a class="tile t-photo" href="#about" style="--i:1">' + (img ? '<img src="' + esc(img.getAttribute('src')) + '" alt="' + esc(img.alt) + '">' : '') + head('about') + '</a>';
    h += '<a class="tile t-bio" href="#about" style="--i:2">' + head('about') + '<p>' + esc(txt(q('.about-bio p'))) + '</p></a>';
    /* projects */
    var cards = qa('.project-card'), years = cards.map(function(c){ return parseInt(txt(c.querySelector('.project-year')), 10); }).filter(function(y){ return y > 1900; });
    var thumbs = qa('.project-card .card-image img').filter(function(i){ return i.getAttribute('src'); }).slice(0, 4)
      .map(function(i){ return '<span><img src="' + esc(i.getAttribute('src')) + '" alt="' + esc(i.alt) + '" loading="lazy"></span>'; }).join('');
    h += '<a class="tile t-projects" href="#projects" style="--i:3">' + head('projects') + '<div class="thumbs">' + thumbs + '</div>'
       + '<p class="tile-n"><b>' + cards.length + '</b> ' + u.projects + (years.length ? ' · ' + Math.min.apply(null, years) + '–' + Math.max.apply(null, years) : '') + '</p></a>';
    /* publications */
    var pubs = qa('.pub-item').slice(0, 4).map(function(p){ return '<li><i>' + esc(txt(p.querySelector('.pub-year'))) + '</i><span>' + esc(txt(p.querySelector('.pub-title'))) + '</span></li>'; }).join('');
    h += '<a class="tile t-pubs" href="#publications" style="--i:4">' + head('publications') + '<ul>' + pubs + '</ul><p class="tile-n"><b>' + qa('.pub-item').length + '</b> ' + u.pubs + '</p></a>';
    /* teaching */
    var lab = txt(q('.lab-name'));
    h += '<a class="tile t-teach" href="#teaching" style="--i:5">' + head('teaching') + (lab ? '<p style="font-size:.82rem;color:var(--gray)">' + u.lab + ' <b style="color:var(--black);font-weight:600">' + esc(lab) + '</b></p>' : '')
       + '<p class="tile-n"><b>' + qa('.course-card, .course-pill').length + '</b> ' + u.courses + '</p></a>';
    /* networks */
    var orgs = qa('#networks li strong').slice(0, 3).map(function(s){ return esc(txt(s)); }).join(' · ');
    h += '<a class="tile t-net" href="#networks" style="--i:6">' + head('networks') + '<p style="font-size:.82rem;color:var(--gray)">' + orgs + '</p>'
       + '<p class="tile-n"><b>' + qa('#networks li').length + '</b> ' + u.roles + '</p></a>';
    /* in motion */
    var press = qa('.press-item').slice(0, 2).map(function(p){ return '<li><span>' + esc(txt(p.querySelector('.press-title'))) + '</span></li>'; }).join('');
    h += '<a class="tile t-motion" href="#chronicle" style="--i:7">' + head('chronicle') + '<ul>' + press + '</ul><p class="tile-n"><b>' + qa('.press-item').length + '</b> ' + u.press + '</p></a>';
    /* contact */
    var socials = qa('.social-link').map(function(a){ return '<a href="' + esc(a.href) + '" target="_blank" rel="noopener">' + esc(txt(a).replace('↗', '').trim()) + ' ↗</a>'; }).join('');
    h += '<div class="tile t-contact" style="--i:8"><p class="tile-k"><span>' + title('contact') + '</span></p><p>' + esc(txt(q('.contact-intro'))) + '</p><div class="socials">' + socials + '</div></div>';

    var b = document.createElement('div'); b.id = 'bento'; b.innerHTML = h; app.insertBefore(b, app.firstChild);
  }

  function route(){
    var id = decodeURIComponent((location.hash || '').slice(1)), el = id && document.getElementById(id);
    var view = el && el.tagName === 'SECTION' ? id : 'overview';
    document.body.dataset.view = view;
    qa('#app > section').forEach(function(s){ s.classList.toggle('is-view', s.id === view); });
    qa('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.view === view); });
    var act = q('.tab.active'); if (act && act.scrollIntoView) act.scrollIntoView({block: 'nearest', inline: 'center'});
    window.scrollTo(0, 0);
  }

  /* COLUMN INDEX LAYOUT */
  function buildColumns(){
    var app = document.getElementById('app');
    function col(cls){ var c = document.createElement('div'); c.className = 'col ' + cls; return c; }
    var c1 = col('col-info'), c2 = col('col-index'), c3 = col('col-work'), c4 = col('col-text');
    var grid = document.createElement('div'); grid.className = 'cols';
    [c1, c2, c3, c4].forEach(function(c){ grid.appendChild(c); });
    app.insertBefore(grid, app.firstChild);
    function mv(sel, c){ var el = q(sel); if (el) c.appendChild(el); }
    var ls = q('nav .lang-switcher'); if (ls) { ls = ls.cloneNode(true); ls.classList.add('lang-inline'); c1.appendChild(ls); }
    var hs = q('.headshot-wrapper'); if (hs) c1.appendChild(hs);
    mv('#home', c1); mv('#about', c1); mv('#networks', c1); mv('#contact', c1); mv('#app > footer', c1);
    var hs = q('.headshot-wrapper'), hm = q('#home'); if (hs && hm) c1.insertBefore(hs, hm);
    mv('#projects', c3);
    mv('#publications', c4); mv('#teaching', c4); mv('#chronicle', c4);
    var h = '<p class="idx-head">' + esc(txt(q('#projects .section-title'))) + '</p><ol class="idx">';
    qa('#projects .project-card').forEach(function(card, i){
      card.dataset.idx = i;
      h += '<li data-idx="' + i + '"><span>' + (i < 9 ? '0' : '') + (i + 1) + '.</span><a href="#projects">' + esc(txt(card.querySelector('.project-title'))) + '</a></li>';
    });
    c2.innerHTML = h + '</ol>';
    var timer;
    c2.addEventListener('mouseover', function(e){ var li = e.target.closest('li'); if (!li) return; clearTimeout(timer); timer = setTimeout(function(){ hot(li.dataset.idx); }, 110); });
    c2.addEventListener('mouseleave', function(){ clearTimeout(timer); hot(null); });
    c2.addEventListener('click', function(e){ var li = e.target.closest('li'); if (!li) return; e.preventDefault(); var card = q('.project-card[data-idx="' + li.dataset.idx + '"]'); if (card) card.click(); });
    c3.addEventListener('mouseover', function(e){ var card = e.target.closest('.project-card'); qa('.idx li.is-hot').forEach(function(l){ l.classList.remove('is-hot'); }); if (card) { var li = q('.idx li[data-idx="' + card.dataset.idx + '"]'); if (li) li.classList.add('is-hot'); } });
    var tabs = document.getElementById('tabs'); tabs.innerHTML = '';
    qa('.nav-dropdown li a').forEach(function(a){ var n = a.querySelector('.nav-item-num'); var l = document.createElement('a'); l.href = a.getAttribute('href'); l.className = 'tab'; l.textContent = txt(a).replace(txt(n), '').trim(); tabs.appendChild(l); });
    syncIndex();
  }
  function hot(i){
    qa('.project-card.is-hot, .idx li.is-hot').forEach(function(e){ e.classList.remove('is-hot'); });
    if (i == null) return;
    var card = q('.project-card[data-idx="' + i + '"]'), li = q('.idx li[data-idx="' + i + '"]');
    if (li) li.classList.add('is-hot');
    if (!card || card.classList.contains('hidden')) return;
    card.classList.add('is-hot');
    var col = q('.col-work'); if (!col || window.innerWidth <= 900) return;
    var r = card.getBoundingClientRect(), cr = col.getBoundingClientRect();
    if (r.top < cr.top + 30 || r.bottom > cr.bottom - 30) col.scrollTo({ top: col.scrollTop + (r.top - cr.top) - (cr.height - r.height) / 2, behavior: 'smooth' });
  }
  function syncIndex(){ qa('.project-card').forEach(function(c){ var li = q('.idx li[data-idx="' + c.dataset.idx + '"]'); if (li) li.classList.toggle('is-hidden', c.classList.contains('hidden')); }); }
  function jump(){
    var id = decodeURIComponent((location.hash || '').slice(1)), el = id && document.getElementById(id);
    qa('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('href') === '#' + id); });
    if (!el || el.tagName !== 'SECTION') return;
    var col = el.closest('.col');
    if (col && window.innerWidth > 900) { col.scrollTo({ top: el.offsetTop - 16, behavior: 'smooth' }); window.scrollTo(0, 0); }
    else el.scrollIntoView();
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  /* SCROLLSPY (unused) */
  var spy = null;
  function initSpy(){
    if (spy) spy.disconnect();
    var links = {};
    document.querySelectorAll('.nav-dropdown li a').forEach(function(a){ links[a.getAttribute('href').slice(1)] = a; });
    spy = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) Object.keys(links).forEach(function(k){ links[k].classList.toggle('is-active', k === e.target.id); }); }); }, {rootMargin: '-40% 0px -55% 0px'});
    Object.keys(links).forEach(function(k){ var el = document.getElementById(k); if (el) spy.observe(el); });
  }

  /* MARQUEE */
  function buildMarquee(){
    var d = document.querySelector('.hero-descriptor'); if(!d) return;
    var items = [].slice.call(d.children), track = document.createElement('div'); track.className = 'marquee-track';
    for (var k = 0; k < 4; k++) items.forEach(function(s){ var c = s.cloneNode(true); if (k) c.setAttribute('aria-hidden','true'); track.appendChild(c); });
    d.innerHTML = ''; d.appendChild(track);
  }

  /* GLOW (follows cursor) */
  (function(){
    var g = document.getElementById('glow');
    if (!g || !window.matchMedia || matchMedia('(hover: none)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var x = innerWidth * .7, y = innerHeight * .35, tx = x, ty = y;
    addEventListener('mousemove', function(e){ tx = e.clientX; ty = e.clientY; }, {passive:true});
    (function loop(){ x += (tx - x) * .07; y += (ty - y) * .07; g.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)'; requestAnimationFrame(loop); })();
  })();

  /* INIT */
  document.body.classList.add('js-loaded');
  setLang(pickLang());
  addEventListener('hashchange', jump);
  (function clock(){
    var el = document.getElementById('clock'); if (!el) return;
    function tick(){ try { var t = new Date().toLocaleString(LANG === 'en' ? 'en-US' : LANG, {timeZone: 'America/Bogota', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'}); el.textContent = t + ' · Barranquilla'; } catch(e){} }
    tick(); setInterval(tick, 1000);
  })();
</script>
</body>
</html>
