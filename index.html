<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>María Cecilia Reyes, Ph.D. · Digital Humanist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0a0a; --white: #ffffff; --accent: #0047FF;
      --accent-light: #eaf0ff; --gray: #777; --light-gray: #f7f7f5;
      --border: #e0e0e0; --off-white: #fafaf8; --warm: #f2f0eb;
      --highlight: #34ebdb;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--white); color: var(--black); font-family: var(--font-serif); font-size: 18px; line-height: 1.65; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 3rem; background: var(--white); border-bottom: 1px solid var(--border); }
    .nav-name { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--black); text-decoration: none; }
    .nav-toggle { display: flex; flex-direction: column; justify-content: center; gap: 5px; cursor: pointer; background: none; border: none; padding: 0.3rem; z-index: 201; }
    .nav-toggle span { display: block; width: 22px; height: 1.5px; background: var(--black); transition: transform 0.25s, opacity 0.25s; transform-origin: center; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .nav-dropdown { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 199; background: var(--white); display: flex; flex-direction: column; justify-content: center; padding: 6rem 3rem 3rem; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .nav-dropdown.open { opacity: 1; pointer-events: all; }
    .nav-dropdown ul { list-style: none; }
    .nav-dropdown li { border-bottom: 1px solid var(--border); }
    .nav-dropdown a { display: flex; align-items: baseline; gap: 1.2rem; padding: 1.1rem 0; font-family: var(--font-serif); font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 400; letter-spacing: -0.02em; text-decoration: none; color: var(--black); transition: color 0.2s; }
    .nav-dropdown a:hover { color: var(--accent); }
    .nav-dropdown a:hover .nav-item-num { color: var(--accent); }
    .nav-item-num { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); letter-spacing: 0.1em; align-self: center; transition: color 0.2s; }
    .nav-dropdown-foot { margin-top: auto; padding-top: 2rem; display: flex; gap: 2rem; }
    .nav-dropdown-foot a { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; color: var(--gray); transition: color 0.2s; }
    .nav-dropdown-foot a:hover { color: var(--accent); }

    /* HERO */
    #home { position: relative; min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; padding-top: 60px; border-bottom: 1px solid var(--border); }
    .hero-left { display: flex; flex-direction: column; justify-content: flex-end; padding: 5rem 3rem; border-right: 1px solid var(--border); }
    /* HERO GLOBE - rotating world map, Caribbean marked in green, click to zoom */
    .hero-globe { position: fixed; top: 0; left: 0; width: 84px; height: 84px; z-index: 150; cursor: pointer; transition: transform 0.6s cubic-bezier(.4,.1,.2,1); }
    .globe-inner { position: relative; width: 100%; height: 100%; }
    .globe-world, .globe-caribbean { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 0.5s ease; }
    .globe-caribbean { opacity: 0; }
    .hero-globe.zoomed .globe-world { opacity: 0; }
    .hero-globe.zoomed .globe-caribbean { opacity: 0.7; }
    .globe-scroll { animation: worldSpin 12s linear infinite; }
    .hero-globe.zoomed .globe-scroll { animation-play-state: paused; }
    @keyframes worldSpin { from { transform: translateX(0); } to { transform: translateX(-100px); } }
    @media (max-width: 640px) { .hero-globe { width: 56px; height: 56px; } }
    @media (prefers-reduced-motion: reduce) { .globe-scroll { animation: none; } .hero-globe { transition: none; } }

    .hero-label { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
    .hero-name { font-size: clamp(2.8rem, 5vw, 4.8rem); font-weight: 400; line-height: 1.08; letter-spacing: -0.01em; }
    .hero-name em { font-style: italic; color: var(--accent); }
    .hero-right { display: flex; flex-direction: column; justify-content: flex-end; padding: 5rem 3rem; }
    .hero-tagline { font-size: 1.15rem; color: var(--gray); max-width: 380px; margin-bottom: 2.5rem; font-style: italic; }
    .hero-descriptor { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--black); }
    .hero-descriptor span { display: block; border-top: 1px solid var(--border); padding-top: 0.6rem; margin-top: 0.6rem; }

    /* SECTION BASE */
    section { padding: 5rem 3rem; border-top: 1px solid var(--border); }
    .section-header { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 4rem; }
    .section-number { font-family: var(--font-mono); font-size: 0.65rem; color: var(--black); letter-spacing: 0.1em; background: var(--highlight); padding: 0.25rem 0.55rem; display: inline-block; }
    .section-title { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 400; letter-spacing: -0.01em; }

    /* FILTER BAR */
    .filter-bar { display: flex; gap: 0; flex-wrap: wrap; border: 1px solid var(--border); width: fit-content; }
    .filter-btn { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; padding: 0.6rem 1.2rem; cursor: pointer; color: var(--gray); border-right: 1px solid var(--border); transition: background 0.15s, color 0.15s; }
    .filter-btn:last-child { border-right: none; }
    .filter-btn:hover { background: var(--accent-light); color: var(--accent); }
    .filter-btn.active { background: var(--highlight); color: var(--black); }
    .projects-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 2.5rem; }

    /* PROJECTS GRID */
    .projects-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .project-card { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.18s; overflow: hidden; }
    .project-card.hidden { display: none; }
    .project-card:hover { background: var(--accent-light); box-shadow: inset 4px 0 0 var(--highlight); }
    .project-card:hover .project-title { color: var(--accent); }
    .card-image { width: 100%; aspect-ratio: 4/3; background: var(--light-gray); overflow: hidden; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
    .project-card:hover .card-image img { transform: scale(1.04); }
    .card-image-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--light-gray); }
    .card-image-placeholder svg { opacity: 0.15; }
    .card-body { padding: 1.2rem 1.2rem 1.4rem; }
    .project-tag { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
    .project-title { font-size: 0.95rem; font-weight: 500; line-height: 1.3; transition: color 0.18s; }
    .project-year { font-family: var(--font-mono); font-size: 0.54rem; color: var(--gray); margin-top: 0.6rem; }
    .project-authors { font-family: var(--font-mono); font-size: 0.58rem; color: var(--gray); letter-spacing: 0.03em; margin-top: 0.15rem; line-height: 1.45; }
    .card-hint { font-family: var(--font-mono); font-size: 0.5rem; color: var(--accent); letter-spacing: 0.08em; margin-top: 0.5rem; opacity: 0; transition: opacity 0.18s; }
    .project-card:hover .card-hint { opacity: 1; }

    /* PROJECT MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); align-items: flex-start; justify-content: center; padding: 80px 2rem 2rem; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border: 1px solid var(--border); max-width: 680px; width: 100%; position: relative; animation: modalIn 0.22s ease; margin-bottom: 2rem; }
    @keyframes modalIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
    .modal-close { position: absolute; top: 1rem; right: 1.2rem; background: none; border: none; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); cursor: pointer; transition: color 0.2s; z-index: 2; }
    .modal-close:hover { color: var(--accent); }
    .modal-media { width: 100%; aspect-ratio: 16/9; background: var(--light-gray); overflow: hidden; }
    .modal-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .modal-media iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-media-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .modal-media-placeholder svg { opacity: 0.12; }
    .modal-body { padding: 2rem 2.5rem 2.5rem; }
    .modal-tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem; }
    .modal-title { font-size: 1.8rem; font-weight: 400; line-height: 1.2; margin-bottom: 0.3rem; }
    .modal-meta-row { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 1.2rem 0 1.6rem; }
    .modal-meta-cell { padding: 0.7rem 1.2rem 0.7rem 0; margin-right: 1.2rem; }
    .modal-meta-label { font-family: var(--font-mono); font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray); display: block; margin-bottom: 0.2rem; }
    .modal-meta-value { font-family: var(--font-mono); font-size: 0.68rem; color: var(--black); }
    .modal-desc { font-size: 1.05rem; color: #333; line-height: 1.75; font-style: normal; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.8rem; }
    .modal-ext-link { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); padding: 0.45rem 0.9rem; transition: background 0.15s, color 0.15s; }
    .modal-ext-link:hover { background: var(--accent); color: var(--white); }

    /* PUBLICATIONS */
    .pub-tabs { display: flex; gap: 0; border: 1px solid var(--border); width: fit-content; margin-bottom: 2.5rem; }
    .pub-tab { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; border-right: 1px solid var(--border); padding: 0.55rem 1rem; cursor: pointer; color: var(--gray); transition: background 0.15s, color 0.15s; }
    .pub-tab:last-child { border-right: none; }
    .pub-tab.active { background: var(--highlight); color: var(--black); }
    .pub-section { display: none; max-width: 820px; }
    .pub-section.active { display: block; }
    .pub-item { display: grid; grid-template-columns: 72px 1fr; gap: 1.5rem; padding: 1.6rem 0; border-bottom: 1px solid var(--border); align-items: start; }
    .pub-year { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); padding-top: 0.2rem; }
    .pub-title { font-size: 1.05rem; font-style: italic; margin-bottom: 0.3rem; line-height: 1.4; }
    .pub-meta { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); letter-spacing: 0.05em; }
    .pub-link { font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent); text-decoration: none; letter-spacing: 0.06em; display: inline-block; margin-top: 0.5rem; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .pub-link:hover { border-color: var(--accent); }

    /* TEACHING */
    #teaching { padding: 5rem 3rem; border-top: 1px solid var(--border); }
    .teaching-sub { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
    .courses-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); margin-bottom: 4rem; }
    .course-card { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 1.8rem 1.6rem; cursor: pointer; transition: background 0.18s; }
    .course-card:hover { background: var(--accent-light); }
    .course-card:hover .course-title { color: var(--accent); }
    .course-type { font-family: var(--font-mono); font-size: 0.57rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
    .course-title { font-size: 1.05rem; font-weight: 500; line-height: 1.3; margin-bottom: 0.4rem; transition: color 0.18s; }
    .course-meta { font-family: var(--font-mono); font-size: 0.57rem; color: var(--gray); letter-spacing: 0.06em; }
    .course-hint { font-family: var(--font-mono); font-size: 0.52rem; color: var(--accent); letter-spacing: 0.08em; margin-top: 0.7rem; opacity: 0; transition: opacity 0.18s; }
    .course-card:hover .course-hint { opacity: 1; }
    .course-modal-desc { font-size: 1.05rem; color: #333; font-style: normal; line-height: 1.75; margin-bottom: 1.8rem; }
    .course-students-label { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .course-student-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .course-student-item { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; }
    .course-student-img { width: 100%; aspect-ratio: 1/1; background: var(--light-gray); overflow: hidden; }
    .course-student-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .course-student-img-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .course-student-img-ph svg { opacity: 0.12; }
    .course-student-caption { padding: 0.6rem 0.7rem; }
    .course-student-name { font-family: var(--font-mono); font-size: 0.54rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--black); }
    .course-student-note { font-family: var(--font-mono); font-size: 0.5rem; color: var(--gray); margin-top: 0.15rem; }
    .lab-block { border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 0; cursor: pointer; transition: background 0.18s; }
    .lab-block:hover { background: var(--accent-light); }
    .lab-left { padding: 2.2rem 2.5rem; border-right: 1px solid var(--border); }
    .lab-right { padding: 2.2rem 2.5rem; display: flex; flex-direction: column; justify-content: flex-end; }
    .lab-eyebrow { font-family: var(--font-mono); font-size: 0.57rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem; }
    .lab-name { font-size: 2.4rem; font-weight: 500; line-height: 1.2; margin-bottom: 0.3rem; transition: color 0.18s; }
    .lab-block:hover .lab-name { color: var(--accent); }
    .lab-tagline { font-size: 0.92rem; font-style: italic; color: var(--gray); }
    .lab-desc { font-size: 0.92rem; color: #444; line-height: 1.65; }
    .lab-hint { font-family: var(--font-mono); font-size: 0.55rem; color: var(--accent); letter-spacing: 0.08em; margin-top: 1rem; opacity: 0; transition: opacity 0.18s; }
    .lab-block:hover .lab-hint { opacity: 1; }

    /* PRESS + EVENTS */
    #chronicle { padding: 5rem 3rem; border-top: 1px solid var(--border); }
    .chronicle-layout { display: grid; grid-template-columns: 1fr 460px; gap: 0; }
    .chronicle-main { padding-right: 3rem; border-right: 1px solid var(--border); }
    .chronicle-aside { padding-left: 2.5rem; }
    .press-sub { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
    .press-item { display: flex; align-items: baseline; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
    .press-item:hover .press-title { color: var(--accent); }
    .press-item:hover { box-shadow: inset 4px 0 0 var(--highlight); }
    .press-type-badge { font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); white-space: nowrap; flex-shrink: 0; width: 68px; }
    .press-title { font-size: 0.95rem; font-weight: 400; line-height: 1.4; flex: 1; transition: color 0.15s; }
    .press-meta-right { font-family: var(--font-mono); font-size: 0.52rem; color: var(--gray); white-space: nowrap; flex-shrink: 0; text-align: right; }
    .press-arrow { font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent); flex-shrink: 0; margin-left: 0.4rem; }
    .cp-toggle { display: flex; gap: 0.5rem; }
    .cp-toggle-btn { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.4rem 0.9rem; border: 1px solid var(--border); background: none; cursor: pointer; color: var(--gray); transition: all 0.18s; }
    .cp-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cp-toggle-btn.active { background: var(--highlight); border-color: var(--highlight); color: var(--black); }
    .cp-list { display: flex; flex-direction: column; gap: 1.4rem; }
    .cp-item { display: block; text-decoration: none; color: inherit; position: relative; padding-right: 1.6rem; }
    .cp-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.3rem; }
    .cp-desc { font-size: 0.9rem; color: #444; line-height: 1.55; margin-bottom: 0.3rem; }
    .cp-meta { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.06em; color: var(--gray); text-transform: uppercase; }
    .cp-arrow { position: absolute; top: 0; right: 0; color: var(--accent); opacity: 0; transition: opacity 0.18s; }
    a.cp-item:hover .cp-arrow { opacity: 1; }
    a.cp-item:hover .cp-title { color: var(--accent); }
    .cp-empty { font-size: 0.9rem; color: var(--gray); font-style: italic; }
    .events-sub { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border); }
    .event-item { display: grid; grid-template-columns: 72px 1fr; gap: 1.4rem; padding: 1.4rem 0; border-bottom: 1px solid var(--border); align-items: start; text-decoration: none; color: inherit; }
    .event-item:hover .event-title { color: var(--accent); }
    .event-date-block { text-align: center; }
    .event-month { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray); }
    .event-day { font-size: 2.8rem; font-weight: 400; line-height: 1; color: var(--accent); }
    .event-year-small { font-family: var(--font-mono); font-size: 0.52rem; color: var(--gray); }
    .event-title { font-size: 1.05rem; font-weight: 500; margin-bottom: 0.3rem; line-height: 1.3; transition: color 0.15s; }
    .event-venue { font-family: var(--font-mono); font-size: 0.58rem; color: var(--gray); letter-spacing: 0.06em; margin-bottom: 0.4rem; }
    .event-badge { display: inline-block; font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.18rem 0.45rem; border: 1px solid var(--accent); color: var(--accent); }
    .event-link-label { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.08em; color: var(--accent); display: inline-block; margin-top: 0.5rem; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
    .event-item:hover .event-link-label { border-color: var(--accent); }

    /* ABOUT */
    #about { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; border-top: 1px solid var(--border); }
    .about-left { padding: 5rem 3rem; border-right: 1px solid var(--border); }
    .about-right { padding: 5rem 3rem; }
    .about-header { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 2rem; }
    .headshot-wrapper { width: 140px; height: 140px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 1.8rem; background: #f4f4f4; }
    .headshot-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .headshot-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem; }
    .headshot-placeholder svg { opacity: 0.2; }
    .headshot-placeholder span { font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray); text-align: center; line-height: 1.8; }
    .about-bio { font-size: 1.05rem; max-width: 500px; color: #333; }
    .about-bio p + p { margin-top: 1.2rem; }
    .about-links { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 2rem; }
    .about-links a { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--black); text-decoration: none; display: flex; align-items: center; gap: 0.6rem; transition: color 0.2s; }
    .about-links a::before { content: '→'; color: var(--accent); }
    .about-links a:hover { color: var(--accent); }
    .field-row { display: flex; border-bottom: 1px solid var(--border); padding: 1rem 0; }
    .field-label { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray); width: 130px; flex-shrink: 0; padding-top: 0.15rem; }
    .field-value { font-size: 0.92rem; color: var(--black); }

    /* CONTACT */
    #contact { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; border-top: 1px solid var(--border); }
    .contact-left { padding: 5rem 3rem; border-right: 1px solid var(--border); }
    .contact-intro { font-size: 1.25rem; font-style: italic; max-width: 420px; color: #444; margin-bottom: 2.5rem; line-height: 1.5; }
    .contact-email { font-size: 1.05rem; color: var(--black); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; transition: color 0.2s; }
    .contact-email:hover { color: var(--accent); }
    .contact-right { padding: 5rem 3rem; display: flex; flex-direction: column; justify-content: flex-end; }
    .social-link { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; color: var(--black); display: flex; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); transition: color 0.2s; }
    .social-link:hover { color: var(--accent); }
    .social-link .arrow { color: var(--accent); margin-left: auto; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 1.8rem 3rem; display: flex; justify-content: space-between; align-items: center; }
    .footer-name { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); }
    .footer-copy { font-family: var(--font-mono); font-size: 0.58rem; color: #ccc; }

    /* LANG SWITCHER */
    .lang-switcher { display: flex; gap: 0; border: 1px solid var(--border); flex-shrink: 0; }
    .lang-btn { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; padding: 0.35rem 0.65rem; color: var(--gray); border-right: 1px solid var(--border); transition: background 0.15s, color 0.15s; }
    .lang-btn:last-child { border-right: none; }
    .lang-btn:hover { color: var(--accent); background: var(--accent-light); }
    .lang-btn.active { background: var(--accent); color: var(--white); }


    /* TEACHING TABLE */
    .teach-table-wrap { overflow-x: auto; margin-bottom: 4rem; -webkit-overflow-scrolling: touch; }
    .teach-table { width: 100%; border-collapse: collapse; font-family: var(--font-serif); font-size: 0.95rem; min-width: 600px; }
    .teach-inst { font-family: var(--font-mono); font-size: 0.63rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray); }
    .teach-table th { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); text-align: left; padding: 0.7rem 1rem 0.7rem 0; border-bottom: 2px solid var(--accent); }
    .teach-table td { padding: 0.75rem 1rem 0.75rem 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .teach-table tr:last-child td { border-bottom: none; }
    .teach-group-row td:first-child { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray); padding-top: 1.2rem; }
    .teach-table td:last-child { font-family: var(--font-mono); font-size: 0.65rem; color: var(--gray); white-space: nowrap; }
    .teach-note { font-size: 0.82rem; color: #666; font-style: italic; padding-top: 0.2rem; padding-bottom: 0.9rem; }
    .teach-alt td { background: var(--light-gray); }
    .teach-row-clickable { cursor: pointer; }
    .teach-row-clickable:hover td { background: var(--accent-light) !important; }
    @media (max-width: 640px) { .teach-table td, .teach-table th { padding: 0.5rem 0.6rem 0.5rem 0; font-size: 0.88rem; } .teach-table { min-width: 400px; } }

        /* NETWORKS */
    @media (max-width:768px) {
      #networks .reveal[style*="display:grid"],
      #networks > div > div[style*="display:grid"] { grid-template-columns:1fr !important; }
      #networks > div > div[style*="display:grid"] > div { border-right:none !important; border-bottom:1px solid var(--border); padding-left:0 !important; padding-right:0 !important; }
    }
    /* CALENDAR */
    .cal-open-btn { display:flex; align-items:center; gap:.8rem; background:none; border:1px solid var(--border); padding:.8rem 1.2rem; cursor:pointer; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--black); width:100%; transition:border-color .2s,color .2s; }
    .cal-open-btn:hover { border-color:var(--accent); color:var(--accent); }
    .cal-icon { display:flex; align-items:center; color:var(--accent); }
    .cal-year { margin-left:auto; color:var(--gray); }
    .cal-preview { margin-top:1.5rem; display:flex; flex-direction:column; gap:1rem; }
    .cal-event-row { display:flex; gap:.8rem; align-items:flex-start; }
    .cal-dot { width:6px; height:6px; background:var(--accent); border-radius:50%; margin-top:.45rem; flex-shrink:0; }
    .cal-ev-title { font-size:.9rem; line-height:1.4; }
    .cal-ev-meta { font-family:var(--font-mono); font-size:.6rem; letter-spacing:.06em; color:var(--gray); margin-top:.2rem; }
    .cal-month { }
    .cal-month-name { font-family:var(--font-mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:.6rem; }
    .cal-days-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-day-hdr { font-family:var(--font-mono); font-size:.5rem; text-align:center; color:var(--gray); padding:.2rem 0; }
    .cal-day { font-family:var(--font-mono); font-size:.62rem; text-align:center; padding:.3rem 0; border-radius:2px; cursor:default; position:relative; }
    .cal-day.has-event { background:var(--highlight); color:var(--black); cursor:pointer; }
    .cal-day.has-event:hover { background:#e0a800; }
    .cal-day.other-month { color:var(--border); }
    .cal-event-list { margin-top:1.5rem; display:flex; flex-direction:column; gap:.5rem; }
    .cal-event-chip { display:flex; align-items:flex-start; gap:.6rem; padding:.7rem 0; border-bottom:1px solid var(--border); }
    .cal-chip-date { font-family:var(--font-mono); font-size:.58rem; letter-spacing:.06em; color:var(--accent); white-space:nowrap; padding-top:.1rem; }
    .cal-chip-title { font-size:.88rem; line-height:1.4; }
    .cal-chip-venue { font-family:var(--font-mono); font-size:.58rem; color:var(--gray); margin-top:.2rem; }
    /* RESPONSIVE */
    @media (max-width: 1200px) { .projects-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .projects-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 860px) {
      nav { padding: 1rem 1.4rem; }
      #home { grid-template-columns: 1fr; min-height: auto; }
      .hero-left { padding: 6rem 1.4rem 2rem; border-right: none; border-bottom: 1px solid var(--border); }
      .hero-right { padding: 2rem 1.4rem 4rem; }
      section, #teaching, #chronicle { padding: 4rem 1.4rem; }
      .projects-grid { grid-template-columns: repeat(2, 1fr); }
      .courses-grid { grid-template-columns: repeat(2, 1fr); }
      .lab-block, #about, #contact { grid-template-columns: 1fr; }
      .lab-left, .about-left, .contact-left { border-right: none; border-bottom: 1px solid var(--border); padding: 4rem 1.4rem; }
      .about-right, .contact-right, .lab-right { padding: 4rem 1.4rem; }
      .chronicle-layout { grid-template-columns: 1fr; }
      .chronicle-main { padding-right: 0; border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 3rem; margin-bottom: 3rem; }
      .chronicle-aside { padding-left: 0; }
      .pub-item { grid-template-columns: 60px 1fr; gap: 1rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.8rem 1.4rem; }
      .modal-body { padding: 1.5rem 1.4rem 2rem; }
    }
    @media (max-width: 480px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }

    /* REVEAL - visible by default, animated when JS loads */
    .js-loaded .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .js-loaded .reveal.visible { opacity: 1; transform: none; }

    /* ===== INDEX — editorial columns (studio150 × remco van baren) ===== */
    :root {
      --bg: #e8e8e5; --paper: #f3f3f1; --ink: #111; --gray: #74746d; --line: #a3a39c; --soft: #d0d0ca; --hl: #34ebdb; --on-hl: #06302c; --accent: #067a71;
      --white: #f3f3f1; --black: #111; --border: #d0d0ca; --light-gray: #dcdcd7; --off-white: transparent; --warm: transparent; --highlight: #34ebdb; --accent-light: rgba(52,235,219,.2);
      --font-serif: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', ui-monospace, monospace; --font-name: 'Unbounded', 'Inter', sans-serif; --bar: 34px;
    }
    *, *::before, *::after { border-radius: 0 !important; }
    html, body { background: var(--bg); }
    body { font-family: var(--font-serif); font-size: 13px; line-height: 1.45; font-weight: 500; color: var(--ink); letter-spacing: -.003em; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    ::selection { background: var(--hl); color: var(--on-hl); }
    .nav-toggle, .nav-dropdown { display: none !important; }
    .js-loaded .reveal { opacity: 1 !important; transform: none !important; }
    section { scroll-margin-top: 80px; }

    /* top bar */
    nav { height: var(--bar); padding: 0; background: var(--bg); border-bottom: 1px solid var(--line); align-items: stretch; gap: 0; }
    .nav-name { order: 0; display: flex; align-items: center; padding: 0 14px; border-right: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ink); text-decoration: none; }
    .nav-clock { order: 1; display: flex; align-items: center; padding: 0 12px; background: var(--ink); color: var(--hl); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }
    .tabs { order: 2; display: flex; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; padding: 0 12px; border-right: 1px solid var(--soft); font-size: 12px; font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--ink); }
    .tab:hover, .tab.active { background: var(--hl); color: var(--on-hl); }
    .lang-switcher { order: 3; display: flex; gap: 0; border: none; border-left: 1px solid var(--line); }
    .lang-btn { height: 100%; padding: 0 11px; background: none; border: none !important; border-right: 1px solid var(--soft) !important; font-family: var(--font-mono); font-size: 11px; color: var(--gray); cursor: pointer; }
    .lang-btn:last-child { border-right: none !important; }
    .lang-btn:hover { color: var(--ink); }
    .lang-btn.active { background: var(--ink) !important; color: var(--hl) !important; }

    /* columns */
    #app { padding-top: var(--bar); }
    .cols { display: grid; grid-template-columns: 24fr 15fr 37fr 24fr; height: calc(100vh - var(--bar)); }
    .col { position: relative; overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); padding: 16px 16px 80px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .col:last-child { border-right: none; }
    .col-work { background: var(--paper); padding: 16px 22px 100px; }
    @media (min-width: 901px) { html, body { height: 100%; overflow: hidden; } }

    .col section, .col #home, .col footer { display: block; min-height: 0; padding: 0 !important; margin: 0 0 38px; border: none !important; background: transparent !important; }
    .col .section-header, .col .about-header { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px !important; padding: 0; border: none; }
    .section-number { background: var(--hl); color: var(--on-hl); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0; padding: 1px 4px; }
    .section-title, .press-sub, .events-sub, .idx-head { font-family: var(--font-serif); font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--ink); text-transform: none; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .section-title::after, .idx-head::after { content: " :"; }
    .flash { animation: flash 1.2s ease; }
    @keyframes flash { 0%, 40% { background: var(--accent-light); } 100% { background: transparent; } }

    /* intro */
    .col #home { padding-bottom: 16px !important; margin-bottom: 18px; border-bottom: 1px solid var(--line) !important; }
    .col .hero-left, .col .hero-right { display: block; padding: 0; border: none; }
    .hero-label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
    .hero-name { font-family: var(--font-name); font-size: 22px; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }
    .hero-name em { font-style: normal; background: var(--hl); color: var(--on-hl); padding: 0 .15em; }
    .hero-tagline { font-size: 13px; font-style: normal; color: var(--ink); max-width: none; margin: 8px 0 10px; }
    .hero-descriptor { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; text-transform: uppercase; }
    .hero-descriptor span { display: inline; margin: 0; padding: 1px 5px; border: none; background: var(--light-gray); }

    /* about */
    .col #about { display: block; }
    .about-left, .about-right { padding: 0 !important; border: none !important; }
    .headshot-wrapper { width: 96px; height: 118px; border: none; margin: 0 0 12px; background: var(--light-gray); }
    .headshot-wrapper img { filter: grayscale(1); transition: filter .4s; }
    .headshot-wrapper:hover img { filter: none; }
    .about-bio { font-size: 13px; max-width: none; color: var(--ink); }
    .about-bio p + p { margin-top: 8px; }
    .about-fields { margin-top: 14px; }
    .field-row { display: grid !important; grid-template-columns: 84px 1fr; gap: 8px; padding: 5px 0; border: none !important; border-top: 1px solid var(--soft) !important; }
    .field-label { font-family: var(--font-mono); font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: .03em; }
    .field-value { font-size: 12px; }

    /* networks (col 1) */
    #networks [style*="grid-template-columns"] { display: block !important; border: none !important; }
    #networks [style*="grid-template-columns"] > div { padding: 0 0 16px !important; border: none !important; }
    #networks p[style] { font-size: 10px !important; margin-bottom: 8px !important; }
    #networks ul { gap: 5px !important; }
    #networks li { font-size: 12px !important; line-height: 1.4; }

    /* contact + footer (col 1) */
    .col #contact { display: block; }
    .contact-left, .contact-right { padding: 0 !important; border: none !important; display: block; }
    .contact-intro { font-size: 13px; font-style: normal; color: var(--ink); max-width: none; margin: 0 0 10px; }
    .social-link { display: flex; justify-content: space-between; padding: 4px 0; border: none !important; border-top: 1px solid var(--soft) !important; font-family: var(--font-mono); font-size: 11px; letter-spacing: .03em; text-transform: uppercase; text-decoration: none; }
    .social-link:hover { background: var(--hl); color: var(--on-hl); }
    .col footer { display: flex; flex-direction: column; gap: 2px; padding-top: 12px !important; border-top: 1px solid var(--line) !important; }
    .footer-name, .footer-copy { font-family: var(--font-mono); font-size: 10px; color: var(--gray); text-transform: none; letter-spacing: 0; }

    /* index (col 2) */
    .idx-head { display: block; margin-bottom: 10px; }
    .idx { list-style: none; }
    .idx li { display: grid; grid-template-columns: 26px 1fr; gap: 2px; padding: 2px 4px; margin: 0 -4px; cursor: pointer; line-height: 1.3; }
    .idx li span { font-family: var(--font-mono); font-size: 11px; color: var(--gray); }
    .idx li a { font-weight: 600; text-decoration: none; }
    .idx li:hover, .idx li.is-hot { background: var(--hl); color: var(--on-hl); }
    .idx li:hover span, .idx li.is-hot span { color: var(--on-hl); }
    .idx li.is-hidden { opacity: .25; }

    /* work collage (col 3) */
    .projects-toolbar { margin-bottom: 26px; }
    .filter-bar, .pub-tabs, .cp-toggle { border: none !important; gap: 4px; flex-wrap: wrap; width: auto; }
    .filter-btn, .pub-tab, .cp-toggle-btn { border: 1px solid var(--line) !important; background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: 10px; letter-spacing: .02em; padding: 3px 7px; }
    .filter-btn:hover, .pub-tab:hover, .cp-toggle-btn:hover { background: var(--light-gray); color: var(--ink); }
    .filter-btn.active, .pub-tab.active, .cp-toggle-btn.active { background: var(--ink) !important; color: var(--hl) !important; border-color: var(--ink) !important; }
    .projects-grid { display: flex !important; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 0; row-gap: 46px; border: none !important; }
    .project-card { border: none !important; background: transparent !important; box-shadow: none !important; overflow: visible; transform: none !important; }
    .project-card:nth-child(6n+1) { width: 58%; }
    .project-card:nth-child(6n+2) { width: 34%; margin-top: 70px; }
    .project-card:nth-child(6n+3) { width: 40%; margin-left: 6%; }
    .project-card:nth-child(6n+4) { width: 44%; margin-top: 40px; margin-right: 4%; }
    .project-card:nth-child(6n+5) { width: 36%; margin-left: 20%; }
    .project-card:nth-child(6n) { width: 32%; margin-top: 90px; }
    .project-card .card-image { aspect-ratio: 4/3; background: var(--light-gray); outline: 3px solid transparent; transition: outline-color .2s; }
    .project-card:nth-child(3n+2) .card-image { aspect-ratio: 1/1; }
    .project-card:nth-child(4n+3) .card-image { aspect-ratio: 3/4; }
    .project-card .card-image img { filter: none; transform: none !important; }
    .project-card:hover .card-image, .project-card.is-hot .card-image { outline-color: var(--hl); }
    .project-card .card-body { padding: 7px 0 0; }
    .project-tag { font-family: var(--font-mono); font-size: 9.5px; color: var(--accent); letter-spacing: .02em; margin-bottom: 2px; }
    .project-title { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; line-height: 1.35; display: inline; }
    .project-card:hover .project-title, .project-card.is-hot .project-title { color: var(--on-hl); background: var(--hl); }
    .project-year, .project-authors { font-family: var(--font-mono); font-size: 10px; color: var(--gray); margin-top: 3px; }
    .card-hint { display: none; }

    /* text column (col 4) */
    .pub-tabs { margin-bottom: 12px; }
    .pub-section { max-width: none; }
    .pub-item { grid-template-columns: 40px 1fr; gap: 8px; padding: 8px 0; border: none; border-top: 1px solid var(--soft); }
    .pub-year { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); }
    .pub-title { font-size: 12.5px; font-style: normal; font-weight: 600; line-height: 1.35; }
    .pub-meta { font-family: var(--font-mono); font-size: 10px; }
    .pub-link { font-family: var(--font-mono); font-size: 10px; color: var(--accent); text-decoration: underline; border: none; }
    .teaching-sub, .col-text .cluster-label { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: .03em; padding-bottom: 4px; margin: 18px 0 6px; border-bottom: 1px solid var(--soft); }
    .lab-block { display: block; border: 1px solid var(--line); background: transparent; }
    .lab-block:hover { background: var(--accent-light); }
    .lab-left, .lab-right { padding: 10px !important; border: none !important; }
    .lab-eyebrow { font-family: var(--font-mono); font-size: 9.5px; }
    .lab-name { font-size: 15px; font-weight: 700; }
    .lab-tagline, .lab-desc { font-size: 12px; font-style: normal; color: var(--ink); }
    .col-text .course-map { gap: 18px; }
    .col-text .course-cards { flex-direction: column; gap: 0; }
    .col-text .course-pill { display: flex !important; flex-direction: row; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; max-width: none; padding: 5px 2px; border: none; border-top: 1px solid var(--soft); background: transparent; transform: none !important; }
    .col-text .course-pill:hover { background: var(--hl); border-color: var(--soft); }
    .col-text .course-pill .cp-title { font-family: var(--font-serif); font-size: 12px; font-weight: 600; }
    .col-text .course-pill:hover .cp-title { color: var(--on-hl); }
    .col-text .course-pill .cp-year { font-family: var(--font-mono); font-size: 9.5px; text-align: right; flex-shrink: 0; max-width: 45%; }
    .col-text .course-pill:hover .cp-year { color: var(--on-hl); }
    .courses-grid { grid-template-columns: 1fr; gap: 0; border: none; }
    .course-card { border: none; border-top: 1px solid var(--soft); padding: 8px 0; }
    .chronicle-layout { display: block; }
    .chronicle-main { padding: 0; border: none !important; }
    .current-projects-block { padding-bottom: 16px !important; margin-bottom: 18px !important; }
    .press-sub { display: block; margin-bottom: 8px; }
    .press-item { display: block; position: relative; padding: 7px 18px 7px 0; border: none !important; border-top: 1px solid var(--soft) !important; text-decoration: none; }
    .press-type-badge { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--accent); text-transform: uppercase; }
    .press-title { display: block; font-size: 12.5px; font-weight: 600; }

    <div class="project-card reveal" data-category="Film|Performance"
      onclick="openModal('Film, Performance','XV Concierto EuroCaribe · Cátedra Europa 2026','2026','Stage Direction · uni5lab','Stage production for the XV Concierto EuroCaribe, part of the 29th Cátedra Europa at Universidad del Norte, dedicated to Austria and the Colombian Caribbean. Around 200 artists, including the UniReformada Symphony Orchestra, the Uninorte Music Department and the Uninorte Folkloric Group, performed Mozart, Haydn and the Strauss family alongside puya, bullerengue, vallenato and porro at the Coliseo Los Fundadores, Barranquilla, for more than 2,200 guests. Students from uni5lab, the audiovisual laboratory of the Social Communication and Journalism program, developed the stage production over six months under the direction of María Cecilia Reyes.','img','https://www.uninorte.edu.co/documents/13400067/78384500/4.png/ea69d9bb-1259-9c64-6abd-4055ffa9c980?t=1790714881129',[{label:'Uninorte · Press',url:'https://www.uninorte.edu.co/web/grupo-prensa/w/xv-concierto-euro-caribe-unio-a-austria-y-la-region-entre-ritmos-y-letras'}])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Film','Festival Iberoamericano de Cine Estudiantil MAREAS','2026','Director of uni5lab · Institutional Producer','MAREAS is the Ibero-American Student Film Festival of Universidad del Norte: a space for encounter, exhibition and dialogue around student audiovisual work, connecting young creators from across Ibero-America with the audiovisual industry. Its official competition includes fiction, documentary and animation.\n\nOrganized by: Universidad del Norte · uni5lab, the audiovisual research and creation laboratory of Universidad del Norte\nSupported by: Alianza Francesa de Barranquilla, Cinemateca del Caribe\n\nCREDITS\nCo-direction and production: Andrea García, Lina Gordillo Zuluaga, Kelyn Pereira Escobar\nDirector of uni5lab and institutional producer: María Cecilia Reyes\nProduction assistant: Gabriela Cuevas\nProgramming coordinator and programmer: Shantal Amortegui\nVisual identity design: Jassir Pérez\nCommunications · MAREAS team: María Angélica Tomás (communications director), Elias Contreras (community manager / editor), Juanita Valencia (editor-in-chief), Laura Londoño (host / editor), Natalie Aguilar (host / editor), María Pérez (host), Laura Moreno (host), María Lucía Vargas (editor), Anna Gómez (host / editor), Adrian Pérez (photography)\nCommunications · uni5lab team: Isaac Madrid (communications coordinator), Sofia Barrios, Carmen Polo, Valeria Márquez\nCommunications · EL PUNTO team: Valentina Villa (editor / photographer), Valerie Caballero (writing / photographer), María Núñez (host), Mariana Balén (host), Alejandra Sumoza (editor), Juanita Valencia (editor)\nDepartment of Social Communication and Journalism: Carolina Carbó\nComunicaciones Uninorte: Victoria Torres (host), Merys Acuña (editor)\nCuratorial coordination: Andrés Álvarez, Wilmer Ortiz Torres\nAcademic programme: Daniela Lazcano (academic coordinator), Gabriela Torres, Manuela Morales, Melissa Huamán\nLogistics: Valentina Rodríguez (logistics coordinator)\nStaff: Adrian Perez Alexander, Andrea María Salinas Mejia, Daniel Stiven Yara Díaz, Daniela Alexandra Gomez Herrera, Dulce María Romero Lacayo, Geilis Sulianis Vergara De La Cruz, Giovanny Alejandro Duarte Alvarez, Isabella Puerto Montes, Juan Esteban Cabrera Fontalvo, Juliana Navarro, Lusiana Sofia Vanegas Barrios, María Sofía Ramos Sierra, Marianne Andrea Rojas Rubio, Natalia Ballestas, Nicolle Maurello, Santiago Eloy Ladeus Cubides, Silvana Montaño Ruiz, Sofia Anteliz Campo, Tomás Santiago Morales Rincon\nModerators: Gabriela Torres, María Camila Alvarez, Shantal Amortegui, Valeria Vargas, Isabella Puerto\nHosts: Franchesca Ceballos, Daniela Lazcano, Shantal Amortegui, Valeria Márquez','img','',[{label:'Festival MAREAS',url:'https://tananeo.uninorte.edu.co/marketplace/servicios/festivalmareas'}])">

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','Authority Figures','2026','Co-Author','Authority Figures is a live networked performance that stages authorship as a governed and contested process rather than a stable identity. The work critiques contemporary efforts either to elevate AI systems as authors or to defend human authorship as a threatened category. Instead of resolving this debate, the performance exposes the infrastructural mechanisms through which claims of authorship are constructed, weighted, and legitimized. From hypertext\'s early promise of distributed textuality to the platform logics that now govern digital culture, creative recognition has always been shaped by technical systems. Yet the rules that determine who receives credit often remain invisible. Authority Figures makes those rules perceptible by turning infrastructural governance into the central dramatic element. Drawing on theories of distributed cognition and platform-mediated authorship, the performance situates creative agency within a system of interacting humans, algorithms, and rule-based constraints. Over a 10–12 minute live session on Zoom, three human performers engage two AI agents in a visible negotiation over the source code of a running p5.js generative e-lit artwork. The live canvas, editable code, revision history, and chat interface are screen-shared, transforming the conferencing platform into a layered textual environment. The AI agents embody contrasting rhetorical positions: one advocates for computational creativity and the legitimacy of machine authorship, while the other destabilizes the coherence of authorship itself. The human performers intervene by editing the code and contesting the agents\' claims. Remote audience members participate through the chat channel, submitting critiques, voting on proposed edits, and, as the session progresses, feeding input directly to the agents. Participation expands over the course of the performance, increasing the number of actors influencing the system. Each revision is logged and visualized through a dynamic authorship meter that assigns proportional credit according to predefined criteria, tracking audience, performer, and agent contributions separately. Crucially, these criteria are neither neutral nor hidden. The weighting logic (what counts as contribution, how revisions are valued, how influence is calculated) is revealed and interrogated during the performance. As inputs multiply, the distribution shifts visibly: a live demonstration of how governance structures reshape attribution in real time. As the code is revised, overwritten, and reweighted, authority migrates among performers, agents, audience members, and the orchestration system that constrains them. The generative artwork becomes secondary to the regulatory process that produces it. By foregrounding the rules that structure contribution, Authority Figures suggests that debates about AI authorship obscure a deeper issue: authorship has long been mediated by platforms, protocols, and institutional criteria that determine recognition. The performance concludes by freezing the final artifact and exposing its revision lineage. Rather than asking whether AI can be an author, the work reframes the debate: does AI involvement fundamentally alter authorship, or does it merely expose the mechanisms through which authorship has always been calculated and performed?\n\nCo-authors: Mark C. Marino, John T. Murray, María Cecilia Reyes','img','images/authority.png',[{label:'ELO 2026 Schedule',url:'https://stars.library.ucf.edu/elo2026/algorithmsandimaginaries/schedule/21/'}])">

    <div class="project-card reveal" data-category="Digital Pedagogy"
      onclick="openModal('Digital Pedagogy','STREAMS / CORRIENTES · ICIDS 2024','2024','General Chair &amp; Program Chair','The 17th International Conference on Interactive Digital Storytelling, the first ICIDS ever held in Latin America. Hosted at Universidad del Norte, Barranquilla, Colombia (December 2–6, 2024). The theme STREAMS / CORRIENTES drew from Barranquilla\'s geography (surrounded by the Caribbean Sea, the Magdalena River, and the Mallorquín Swamp) to invite reflection on movement, exchange, convergences and divergences in interactive narrative research. 41 papers across 2 volumes. 300+ attendees from across the globe.\n\nGeneral Chair & Program Chair: María Cecilia Reyes · Program Co-Chair: John T. Murray (University of Central Florida) · Published in Springer LNCS 15467–15468.','img','images/icids2024-banner.jpg',[{label:'Conference website',url:'https://icids2024.ardin.online/'},{label:'Springer proceedings',url:'https://link.springer.com/book/9783031784521'}])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Emergent Media','Chill Out! Interactive Cinema is not Dead!','2024','Lead Researcher & Workshop Director','How to create an interactive narrative that integrates a Brain-Computer Interface (BCI)? This co-created interactive short film uses the relaxation parameter of an EEG headset to trigger story progression. The interactor must consciously relax to advance through a series of stressful situations. Developed in a 3-day workshop entirely by students at Universidad del Norte (Colombia), framed in interactive cinema (Hales, 2015), enactive cinema (Tikka, 2008), and IDN studies (Koenitz, 2023). Workshop led by professor Chris Hales. First tests demonstrated that narrative affects emotions and biological data: during the experience, stressed participants learned to relax to progress the story.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1720982335154-DKR5VM9890GBG0CPPL6G/IMG_1239.jpeg',[])">

    <div class="project-card reveal" data-category="Publication"
      onclick="openModal('Publication','Interactive Fiction in Cinematic VR · Towards the Interactive Immersive Movie','2024','Author','A narrative model combining live-action 360° video with interactive fiction structure to create immersive and interactive narrative experiences. The book presents an epistemology of immersive interactive movies (analyzing artistic, narrative, and interactive qualities), the production workflow, and an evaluation methodology. Proposes that all VR movies should be interactive, building a bridge between cinema and virtual reality. Published by Mimesis International (228 pp., ISBN 9788869773259).','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1711126599808-60DANPKMJFKHMKQSPX54/international-reyes-interactive-fiction-cinematic-virtual-reality.jpg',[{label:'Mimesis International',url:'https://mimesisinternational.com/interactive-fiction-in-cinematic-virtual-reality-towards-the-interactive-immersive-movie/'},{label:'Amazon',url:'https://www.amazon.com/Interactive-Fiction-Cinematic-Virtual-Reality/dp/8869773256'}])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Emergent Media','Inverted Dreaming','2022','Artist','An immersive video installation born from footage shot at the Parco delle Alpi Marittime (Maritime Alps National Park) during the Le Marittime Irraggiungibili 360° workshop (2016). The installation evokes the disjointed logic of dreams: have you ever awakened trying to reconstruct the disconnected imagery of a long dream? Inverted Dreaming attempts to build that impossible logic line, suspended between memory and imagination, sometimes very clear, other times in non-natural colors, sometimes about people we know in the bodies of people we don\'t recognize.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/7482f125-3c0b-4945-a1ad-53365ddc878b/Performance+3.png',[])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Emergent Media','Pueblo Santo · A Cumbia Trip','2022','Creator & Director','A multi-reality interactive musical experience for VR. Pueblo Santo, the place where Cumbia music originated, suffered a horrible massacre that submerged the town in an eternal fog. Only the lost gaita player can bring the town back to life by playing Cumbia\'s original melody. The indigenous Amacumbié cosmogony intertwines with Colombia\'s history of violence, challenging the interactor to explore the town and restore life by learning to play Cumbia. Based on Historias Cantadas, a concept album by Gaiteros de Pueblo Santo (nominated for best folklore album at the 2021 Latin Grammys). Available for stand-alone VR headsets and as a physical multi-sensorial installation. Work-in-progress. Illustration by Laura Ortiz.\n\nDirector: María Cecilia Reyes · Producer: Laura Casadiego · Storyworld & Music: Marlon Peroza','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1648667205869-YORUCV1N3S36BL5CCCT1/Screenshot+2022-03-30+at+21.46.12.png',[])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Film','Same Different','2022','Co-Director','A poetry short film, a rare encounter between Khoekhoegowab and a still camera. The poem, written and performed by Ques (Nesindano Namises), together with the sounds of the bow and the forest, move along the sun, the wind, and the spirit of the poet herself. All Khoekhoegowab is also spoken in English. Subtitling is intentionally absent so as not to interrupt the rhythm of the poem and to create a sense of relation with Khoekhoegowab. Poster art by Namibian artist Vitjitua Ndjiharine.\n\nCo-directed by Ques (Nesindano Namises) & María Cecilia Reyes. Selected: 10th International Video Poetry Festival · International Poetry Film Festival of Thuringia (Germany) · Future Media Theaters, University of Skövde.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1651337730179-YVI1YT3K84MAJ88S8RBQ/IMG_3811.jpg',[])">

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','En el Principio Todo Era Cumbia','2021','Co-Creator & Performer','A storytelling and musical performance that explores the cosmogonies of Cumbia music, the meanings and stories in this ancient rhythm, its instruments, its songs, and its dance. A trip to the pre-Columbian Caribbean coast of the land today called Colombia. Through narration, dance, and live-streamed music connecting Barranquilla\'s downtown to Schloss Solitude, Marlon Peroza, Carlos Monroy and María Cecilia Reyes explore Cumbia as the original heartbeat: being Native American, African, colonized, enslaved; being feminine, masculine and everything in the spectrum; being water, earth, air, and fire.\n\nWith Marlon Peroza & Carlos Monroy. Developed at Schloss Solitude Akademie, Germany.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1633098814083-HR7R0PDQI4K5RRBMI3IS/Screenshot%2B2021-10-01%2Bat%2B16.25.14.jpg',[])">

    <div class="project-card reveal" data-category="Publication"
      onclick="openModal('Publication','Texts of Discomfort: Interactive Storytelling Art','2021','Co-Editor','Can discomfort be blissful? This volume presents an in-depth reflection on the selected artworks for the Art Exhibition of ICIDS 2020 (13th International Conference on Interactive Digital Storytelling, Bournemouth University, UK). The curatorial theme follows Barthes\'s concept of the Text of Bliss: \'the text that imposes a state of loss, the text that discomforts... unsettles the reader\'s historical, cultural, psychological assumptions.\' Interactive digital artworks that generate discomfort through form and content can inspire radical changes in the way we perceive the world.\n\nCo-edited with James Pope. CMU ETC Press.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1639101320540-QPILSUFYLNUS5BMA8QZN/750px+Wide+-+519px+Tall.jpg',[{label:'CMU ETC Press',url:'https://press.etc.cmu.edu/index.php/product/texts-of-discomfort/'}])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Emergent Media','Yona Friedman · Ceramic City VR','2021','VR Developer','Yona Friedman\'s Ceramic City brought to life in virtual reality. In 2002, during the second Biennale of Ceramics, architect Yona Friedman (Budapest, 1923) created his ideal city from ceramics, to inspire young generations of artists, architects, musicians, and designers. This VR experience (created through an interpretation by Omar Tonella) allows the user to activate choices that change scenery. The journey begins at the Savona Ceramics Museum and enters its virtual reproduction; the user activates Friedman\'s voice, which mixes with a 360° sound setting by ceramist Jorge Fernandez playing musical instruments made of ceramic.\n\nA project by the Ceramics Museum of Savona and the Department of Architecture and Design, University of Genoa. Conceived by Tiziana Casapietra.','img','images/yonafriedman.jpg',[{label:'Savona Ceramics Museum',url:'http://musa.savona.it/museodellaceramica/en/inside-yona-friedmans-ceramic-city/'}])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Film','NIJOLE','2020','Screenwriter & Editor','An intimate portrait of Lithuanian-Colombian artist Nijolė Sivickas (1925–2018) and her unusual relationship with her son, philosopher, mathematician and politician Antanas Mockus. Through Baltic landscapes and the streets of Bogotá, Nijolė and Antanas explore art, politics, migration, independence, the emancipation of women, and the concept of family. A film about the relationship between art and love, and about freedom.\n\nDirector: Sandro Bozzolo · Screenwriter & Editor: María Cecilia Reyes · Producers: Sandro Bozzolo, Max Chicco\n\nWorld Premiere: DOK.Leipzig 61st edition · Next Masters Competition · FICCI (Colombia) · Muestra Migración y Mestizaje · DOCSBarcelona · Selección Oficial Panorama · BiografilmFEST · Celebration of Lives Award · VDFF Vilnius · Opening Film','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1609175748826-XF5VF1F4K2VAFT6ZZBL9/Untitled2_1.250.1.jpg',[{label:'Watch on RTVCplay',url:'https://rtvcplay.co/peliculas-documentales/nijole'},{label:'Watch on Vimeo',url:'https://vimeo.com/ondemand/nijole'}])">

    <div class="project-card reveal" data-category="Emergent Media"

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Emergent Media','ZENA · Interactive VR Film','2018','Director & Camera','"The one choosing the path won\'t be Lorenzo, but you." Lorenzo, a young apprentice of Alchemy, receives a call from the future through a dream: the magic clepsydra of his congregation is about to be destroyed. To save it he must travel 500 years into the future, to modern Zena (Genoa in the Genoese dialect). Through the journey he discovers how his city changed over centuries, finding new alleys and old enemies. To save the clepsydra he must pay close attention to details, because in Zena, things are not always what they seem.\n\nDirector & Camera: María Cecilia Reyes. First interactive VR film set in Genoa. Developed at the University of Genoa e-learning division.','img','images/zena.jpg',[])">
      <div class="card-image"><img src="images/zena.jpg" alt="ZENA · Interactive VR Film" /></div>

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','Authority Figures','2026','Co-Author','Authority Figures is a live networked performance that stages authorship as a governed and contested process rather than a stable identity. The work critiques contemporary efforts either to elevate AI systems as authors or to defend human authorship as a threatened category. Instead of resolving this debate, the performance exposes the infrastructural mechanisms through which claims of authorship are constructed, weighted, and legitimized. From hypertext\'s early promise of distributed textuality to the platform logics that now govern digital culture, creative recognition has always been shaped by technical systems. Yet the rules that determine who receives credit often remain invisible. Authority Figures makes those rules perceptible by turning infrastructural governance into the central dramatic element. Drawing on theories of distributed cognition and platform-mediated authorship, the performance situates creative agency within a system of interacting humans, algorithms, and rule-based constraints. Over a 10–12 minute live session on Zoom, three human performers engage two AI agents in a visible negotiation over the source code of a running p5.js generative e-lit artwork. The live canvas, editable code, revision history, and chat interface are screen-shared, transforming the conferencing platform into a layered textual environment. The AI agents embody contrasting rhetorical positions: one advocates for computational creativity and the legitimacy of machine authorship, while the other destabilizes the coherence of authorship itself. The human performers intervene by editing the code and contesting the agents\' claims. Remote audience members participate through the chat channel, submitting critiques, voting on proposed edits, and, as the session progresses, feeding input directly to the agents. Participation expands over the course of the performance, increasing the number of actors influencing the system. Each revision is logged and visualized through a dynamic authorship meter that assigns proportional credit according to predefined criteria, tracking audience, performer, and agent contributions separately. Crucially, these criteria are neither neutral nor hidden. The weighting logic (what counts as contribution, how revisions are valued, how influence is calculated) is revealed and interrogated during the performance. As inputs multiply, the distribution shifts visibly: a live demonstration of how governance structures reshape attribution in real time. As the code is revised, overwritten, and reweighted, authority migrates among performers, agents, audience members, and the orchestration system that constrains them. The generative artwork becomes secondary to the regulatory process that produces it. By foregrounding the rules that structure contribution, Authority Figures suggests that debates about AI authorship obscure a deeper issue: authorship has long been mediated by platforms, protocols, and institutional criteria that determine recognition. The performance concludes by freezing the final artifact and exposing its revision lineage. Rather than asking whether AI can be an author, the work reframes the debate: does AI involvement fundamentally alter authorship, or does it merely expose the mechanisms through which authorship has always been calculated and performed?\n\nCo-authors: Mark C. Marino, John T. Murray, María Cecilia Reyes','img','images/authority.png',[{label:'ELO 2026 Schedule',url:'https://stars.library.ucf.edu/elo2026/algorithmsandimaginaries/schedule/21/'}])">
      <div class="card-image"><img src="images/authority.png" alt="Authority Figures" /></div>

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Medios Emergentes','Chill Out! Interactive Cinema is not Dead!','2024','Lead Researcher & Workshop Director','How to create an interactive narrative that integrates a Brain-Computer Interface (BCI)? This co-created interactive short film uses the relaxation parameter of an EEG headset to trigger story progression. The interactor must consciously relax to advance through a series of stressful situations. Developed in a 3-day workshop entirely by students at Universidad del Norte (Colombia), framed in interactive cinema (Hales, 2015), enactive cinema (Tikka, 2008), and IDN studies (Koenitz, 2023). Workshop led by professor Chris Hales. First tests demonstrated that narrative affects emotions and biological data: during the experience, stressed participants learned to relax to progress the story.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1720982335154-DKR5VM9890GBG0CPPL6G/IMG_1239.jpeg',[])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Medios Emergentes','Inverted Dreaming','2022','Artist','An immersive video installation born from footage shot at the Parco delle Alpi Marittime (Maritime Alps National Park) during the Le Marittime Irraggiungibili 360° workshop (2016). The installation evokes the disjointed logic of dreams: have you ever awakened trying to reconstruct the disconnected imagery of a long dream? Inverted Dreaming attempts to build that impossible logic line, suspended between memory and imagination, sometimes very clear, other times in non-natural colors, sometimes about people we know in the bodies of people we don\'t recognize.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/7482f125-3c0b-4945-a1ad-53365ddc878b/Performance+3.png',[])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Medios Emergentes','Pueblo Santo · A Cumbia Trip','2022','Creator & Director','A multi-reality interactive musical experience for VR. Pueblo Santo, the place where Cumbia music originated, suffered a horrible massacre that submerged the town in an eternal fog. Only the lost gaita player can bring the town back to life by playing Cumbia\'s original melody. The indigenous Amacumbié cosmogony intertwines with Colombia\'s history of violence, challenging the interactor to explore the town and restore life by learning to play Cumbia. Based on Historias Cantadas, a concept album by Gaiteros de Pueblo Santo (nominated for best folklore album at the 2021 Latin Grammys). Available for stand-alone VR headsets and as a physical multi-sensorial installation. Work-in-progress. Illustration by Laura Ortiz.\n\nDirector: María Cecilia Reyes · Producer: Laura Casadiego · Storyworld & Music: Marlon Peroza','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1648667205869-YORUCV1N3S36BL5CCCT1/Screenshot+2022-03-30+at+21.46.12.png',[])">

    <div class="project-card reveal" data-category="Film"
      onclick="openModal('Cine','Same Different','2022','Co-Director','A poetry short film, a rare encounter between Khoekhoegowab and a still camera. The poem, written and performed by Ques (Nesindano Namises), together with the sounds of the bow and the forest, move along the sun, the wind, and the spirit of the poet herself. All Khoekhoegowab is also spoken in English. Subtitling is intentionally absent so as not to interrupt the rhythm of the poem and to create a sense of relation with Khoekhoegowab. Poster art by Namibian artist Vitjitua Ndjiharine.\n\nCo-directed by Ques (Nesindano Namises) & María Cecilia Reyes. Selected: 10th International Video Poetry Festival · International Poetry Film Festival of Thuringia (Germany) · Future Media Theaters, University of Skövde.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1651337730179-YVI1YT3K84MAJ88S8RBQ/IMG_3811.jpg',[])">

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','En el Principio Todo Era Cumbia','2021','Co-Creator & Performer','A storytelling and musical performance that explores the cosmogonies of Cumbia music, the meanings and stories in this ancient rhythm, its instruments, its songs, and its dance. A trip to the pre-Columbian Caribbean coast of the land today called Colombia. Through narration, dance, and live-streamed music connecting Barranquilla\'s downtown to Schloss Solitude, Marlon Peroza, Carlos Monroy and María Cecilia Reyes explore Cumbia as the original heartbeat: being Native American, African, colonized, enslaved; being feminine, masculine and everything in the spectrum; being water, earth, air, and fire.\n\nWith Marlon Peroza & Carlos Monroy. Developed at Schloss Solitude Akademie, Germany.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1633098814083-HR7R0PDQI4K5RRBMI3IS/Screenshot%2B2021-10-01%2Bat%2B16.25.14.jpg',[])">

    <div class="project-card reveal" data-category="Publication"
      onclick="openModal('Publicación','Texts of Discomfort: Interactive Storytelling Art','2021','Co-Editor','Can discomfort be blissful? This volume presents an in-depth reflection on the selected artworks for the Art Exhibition of ICIDS 2020 (13th International Conference on Interactive Digital Storytelling, Bournemouth University, UK). The curatorial theme follows Barthes\'s concept of the Text of Bliss: \'the text that imposes a state of loss, the text that discomforts... unsettles the reader\'s historical, cultural, psychological assumptions.\' Interactive digital artworks that generate discomfort through form and content can inspire radical changes in the way we perceive the world.\n\nCo-edited with James Pope. CMU ETC Press.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1639101320540-QPILSUFYLNUS5BMA8QZN/750px+Wide+-+519px+Tall.jpg',[{label:'CMU ETC Press',url:'https://press.etc.cmu.edu/index.php/product/texts-of-discomfort/'}])">

    <div class="project-card reveal" data-category="Film"

    <div class="project-card reveal" data-category="Emergent Media"

    <div class="project-card reveal" data-category="Performance"
      onclick="openModal('Performance','Authority Figures','2026','Co-Author','Authority Figures is a live networked performance that stages authorship as a governed and contested process rather than a stable identity. The work critiques contemporary efforts either to elevate AI systems as authors or to defend human authorship as a threatened category. Instead of resolving this debate, the performance exposes the infrastructural mechanisms through which claims of authorship are constructed, weighted, and legitimized. From hypertext\'s early promise of distributed textuality to the platform logics that now govern digital culture, creative recognition has always been shaped by technical systems. Yet the rules that determine who receives credit often remain invisible. Authority Figures makes those rules perceptible by turning infrastructural governance into the central dramatic element. Drawing on theories of distributed cognition and platform-mediated authorship, the performance situates creative agency within a system of interacting humans, algorithms, and rule-based constraints. Over a 10–12 minute live session on Zoom, three human performers engage two AI agents in a visible negotiation over the source code of a running p5.js generative e-lit artwork. The live canvas, editable code, revision history, and chat interface are screen-shared, transforming the conferencing platform into a layered textual environment. The AI agents embody contrasting rhetorical positions: one advocates for computational creativity and the legitimacy of machine authorship, while the other destabilizes the coherence of authorship itself. The human performers intervene by editing the code and contesting the agents\' claims. Remote audience members participate through the chat channel, submitting critiques, voting on proposed edits, and, as the session progresses, feeding input directly to the agents. Participation expands over the course of the performance, increasing the number of actors influencing the system. Each revision is logged and visualized through a dynamic authorship meter that assigns proportional credit according to predefined criteria, tracking audience, performer, and agent contributions separately. Crucially, these criteria are neither neutral nor hidden. The weighting logic (what counts as contribution, how revisions are valued, how influence is calculated) is revealed and interrogated during the performance. As inputs multiply, the distribution shifts visibly: a live demonstration of how governance structures reshape attribution in real time. As the code is revised, overwritten, and reweighted, authority migrates among performers, agents, audience members, and the orchestration system that constrains them. The generative artwork becomes secondary to the regulatory process that produces it. By foregrounding the rules that structure contribution, Authority Figures suggests that debates about AI authorship obscure a deeper issue: authorship has long been mediated by platforms, protocols, and institutional criteria that determine recognition. The performance concludes by freezing the final artifact and exposing its revision lineage. Rather than asking whether AI can be an author, the work reframes the debate: does AI involvement fundamentally alter authorship, or does it merely expose the mechanisms through which authorship has always been calculated and performed?\n\nCo-authors: Mark C. Marino, John T. Murray, María Cecilia Reyes','img','images/authority.png',[{label:'ELO 2026 Schedule',url:'https://stars.library.ucf.edu/elo2026/algorithmsandimaginaries/schedule/21/'}])">
      <div class="card-image"><img src="images/authority.png" alt="Authority Figures" /></div>

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Media Emergenti','Chill Out! Interactive Cinema is not Dead!','2024','Lead Researcher & Workshop Director','How to create an interactive narrative that integrates a Brain-Computer Interface (BCI)? This co-created interactive short film uses the relaxation parameter of an EEG headset to trigger story progression. The interactor must consciously relax to advance through a series of stressful situations. Developed in a 3-day workshop entirely by students at Universidad del Norte (Colombia), framed in interactive cinema (Hales, 2015), enactive cinema (Tikka, 2008), and IDN studies (Koenitz, 2023). Workshop led by professor Chris Hales. First tests demonstrated that narrative affects emotions and biological data: during the experience, stressed participants learned to relax to progress the story.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/1720982335154-DKR5VM9890GBG0CPPL6G/IMG_1239.jpeg',[])">

    <div class="project-card reveal" data-category="Emergent Media"
      onclick="openModal('Media Emergenti','Inverted Dreaming','2022','Artist','An immersive video installation born from footage shot at the Parco delle Alpi Marittime (Maritime Alps National Park) during the Le Marittime Irraggiungibili 360° workshop (2016). The installation evokes the disjointed logic of dreams: have you ever awakened trying to reconstruct the disconnected imagery of a long dream? Inverted Dreaming attempts to build that impossible logic line, suspended between memory and imagination, sometimes very clear, other times in non-natural colors, sometimes about people we know in the bodies of people we don\'t recognize.','img','https://images.squarespace-cdn.com/content/v1/57c88e7615d5db26d8ab6bf3/7482f125-3c0b-4945-a1ad-53365ddc878b/Performance+3.png',[])">
